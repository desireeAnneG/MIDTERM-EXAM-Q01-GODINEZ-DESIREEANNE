<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Inventory Restock System</title>

    <style>

        body {
            font-family: Arial;
            width: 800px;
            margin: 40px auto;
        }

        input,
        select {
            padding: 8px;
            margin: 5px;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 10px;
        }

        .available {
            color: green;
            font-weight: bold;
        }

        .low {
            color: orange;
            font-weight: bold;
        }

        .out {
            color: red;
            font-weight: bold;
        }

        #message {
            margin: 10px 5px;
            font-weight: bold;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-box {
            background: white;
            width: 400px;
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            border-bottom: 1px solid #e5e5e5;
        }

        .modal-header h3 {
            margin: 0;
            font-weight: normal;
            font-size: 20px;
        }

        .modal-close {
            border: none;
            background: none;
            font-size: 22px;
            color: #999;
            margin: 0;
            padding: 0;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            padding: 15px 20px;
            border-top: 1px solid #e5e5e5;
        }

        .modal-footer button {
            margin: 0;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 15px;
        }

        .btn-cancel {
            background: white;
            border: 1px solid #ccc;
            color: #333;
        }

        .btn-delete {
            background: #d9534f;
            border: 1px solid #d43f3a;
            color: white;
        }

    </style>

</head>


<body>

    <h1>Inventory Management</h1>

    <div id="message"></div>


    <h2>Add Product</h2>

    <input
        type="text"
        id="productName"
        placeholder="Product Name"
    >

    <select id="category">
        <option value="">Select Category</option>
        <option value="Electronics">Electronics</option>
        <option value="Accessories">Accessories</option>
        <option value="School Supplies">School Supplies</option>
        <option value="Groceries">Groceries</option>
        <option value="Clothing">Clothing</option>
        <option value="Makeup">Makeup</option>
        <option value="Daily Necessities">Daily Necessities</option>
    </select>

    <input
        type="number"
        id="price"
        placeholder="Price"
        step="0.01"
    >

    <input
        type="number"
        id="stock"
        placeholder="Stock"
    >

    <button onclick="addProduct()">
        Add Product
    </button>


    <h2>Search Product by ID</h2>

    <input
        type="number"
        id="searchId"
        placeholder="Product ID"
    >

    <button onclick="searchProduct()">
        Search
    </button>


    <h2>Products</h2>

<button onclick="loadAllProducts()">
    Load All Products
</button>


    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Product Name</th>
                <th>Category</th>
                <th>Price</th>
                <th>Stock</th>
                <th>Status</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="productTable">

        </tbody>

    </table>


    <!-- Delete message box -->

    <div id="deleteModal" class="modal-overlay">

        <div class="modal-box">

            <div class="modal-header">

                <h3>Delete</h3>

                <button class="modal-close" onclick="closeDeleteModal()">
                    &times;
                </button>

            </div>

            <div class="modal-body">

                <p id="deleteModalText"></p>

            </div>

            <div class="modal-footer">

                <button class="btn-cancel" onclick="closeDeleteModal()">
                    Cancel
                </button>

                <button class="btn-delete" onclick="confirmDelete()">
                    Delete
                </button>

            </div>

        </div>

    </div>


    <script>



        function showMessage(text, isError) {

            const box =
                document.getElementById("message");

            box.textContent = text;

            box.style.color =
                isError ? "red" : "green";

        }


        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        function statusClass(status) {

            if (status === "OUT OF STOCK") {
                return "out";
            }

            if (status === "LOW STOCK") {
                return "low";
            }

            return "available";

        }


        function renderRows(products) {

            const table =
                document.getElementById(
                    "productTable"
                );


            table.innerHTML = "";


            if (products.length === 0) {

                table.innerHTML = `
                    <tr>
                        <td colspan="7">No products found.</td>
                    </tr>
                `;

                return;

            }


            products.forEach(product => {

                const row = `
                    <tr>

                        <td>${product.id}</td>

                        <td>${escapeHtml(product.product_name)}</td>

                        <td>${escapeHtml(product.category)}</td>

                        <td>${Number(product.price).toFixed(2)}</td>

                        <td>${product.stock}</td>

                        <td class="${statusClass(product.stock_status)}">
                            ${product.stock_status}
                        </td>

                        <td>
                            <button onclick="deleteProduct(${product.id})">
                                Delete
                            </button>
                        </td>

                    </tr>
                `;


                table.innerHTML += row;

            });

        }

async function loadProducts() {

    const response =
        await fetch("/api/products");


    const products =
        await response.json();


    renderRows(products);

}



async function loadAllProducts() {

    await loadProducts();

    showMessage("Products loaded.", false);

}

       

        async function searchProduct() {

            const id =
                document.getElementById(
                    "searchId"
                ).value;


            if (id === "") {

                showMessage(
                    "Please enter a product ID.",
                    true
                );

                return;

            }


            const response =
                await fetch(
                    "/api/products/" + id
                );


            const result =
                await response.json();


            if (!response.ok) {

                showMessage(result.message, true);

                renderRows([]);

                return;

            }


            showMessage("Product found.", false);

            renderRows([result]);

        }



        async function addProduct() {

            const product_name =
                document.getElementById(
                    "productName"
                ).value;


            const category =
                document.getElementById(
                    "category"
                ).value;


            const price =
                document.getElementById(
                    "price"
                ).value;


            const stock =
                document.getElementById(
                    "stock"
                ).value;


            const product = {

                product_name: product_name,

                category: category,

                price: price,

                stock: stock

            };


            const response =
                await fetch(
                    "/api/products",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(product)

                    }
                );


            const result =
                await response.json();


            if (!response.ok) {

                showMessage(result.message, true);

                return;

            }


            showMessage(result.message, false);


           

            document.getElementById(
                "productName"
            ).value = "";

            document.getElementById(
                "category"
            ).value = "";

            document.getElementById(
                "price"
            ).value = "";

            document.getElementById(
                "stock"
            ).value = "";


          

            loadProducts();

        }


        let pendingDeleteId = null;


        function deleteProduct(id) {

            pendingDeleteId = id;

            document.getElementById(
                "deleteModalText"
            ).textContent =
                "Are you sure you want to delete this item?";

            document.getElementById(
                "deleteModal"
            ).style.display = "flex";

        }



        function closeDeleteModal() {

            pendingDeleteId = null;

            document.getElementById(
                "deleteModal"
            ).style.display = "none";

        }


        async function confirmDelete() {

            const id = pendingDeleteId;

            closeDeleteModal();


            const response =
                await fetch(
                    "/api/products/" + id,
                    {
                        method: "DELETE"
                    }
                );


            const result =
                await response.json();


            showMessage(
                result.message,
                !response.ok
            );


         

            loadProducts();

        }


      
        loadProducts();

    </script>

</body>

</html>
